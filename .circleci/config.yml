version: 2.1

# One disposable EhWS FreeBSD executor: bound peak RAM and preserve one coherent
# candidate/source set. Hardware rollout and catalogue publication are separate.
jobs:
  freebsd-build-test-package:
    environment:
      PYTHON: /usr/local/bin/python3.12
      BSD3_CI_DNS: 192.168.12.153
      BSD3_CI_PORTS_ROOT: /var/tmp/bsd3-ci-ports
      PORTSDIR: /var/tmp/bsd3-ci-ports
    machine:
      image: freebsd-15.1:current
    resource_class: freebsd.medium
    steps:
      - checkout
      - run:
          name: Install build and ports validation dependencies
          command: |
            set -eu
            export PATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin
            sudo pkg install -y git pkgconf glib dbus consolekit2 python312 gmake gnome-desktop bind-tools curl
      - run:
          name: Prepare one pinned framework for serial candidate consumers
          command: sh tools/ci-ports-tree.sh "$BSD3_CI_PORTS_ROOT" "$(cat packaging/freebsd/mutter49/PORTS_REVISION)"
      - run:
          name: Rebuild ConsoleKit with native FreeBSD device semantics
          no_output_timeout: 20m
          command: sh tools/ci-consolekit.sh
      - run:
          name: Native Dinit, user-session SDK and real GNOME49 protocol tests
          no_output_timeout: 20m
          command: sh tools/ci-user-session.sh
      - run:
          name: Native build, private-bus tests and ports stage QA
          no_output_timeout: 20m
          command: sh tools/ci-freebsd.sh
      - run:
          name: Native service lifecycle and root-only system-bus policy
          command: sh tools/ci-service.sh
      - run:
          name: Real ConsoleKit session, kernel revocation and VT switch regression
          command: sh tools/test-native-consolekit.sh
      - run:
          name: Rebuild Mutter port with native backend and BSD3 provider
          no_output_timeout: 30m
          command: sh tools/ci-mutter.sh
      - run:
          name: Real ConsoleKit GNOME session, Wayland window and logout
          command: sh tools/ci-gnome.sh
      - run:
          name: Real SDDM registration and bounded GNOME trial recovery
          no_output_timeout: 10m
          command: sh tools/ci-sddm.sh
      - run:
          name: Build native GDM port and verify seat and VT boundaries
          no_output_timeout: 30m
          command: sh tools/ci-gdm.sh
      - run:
          name: Build GNOME49 runtime dependencies and test actual GJS
          no_output_timeout: 30m
          command: sh tools/ci-gnome49-runtime.sh
      - run:
          name: Install this candidate's tested runtime dependency packages
          command: sh tools/ci-install-runtime49.sh
      - run:
          name: Build GNOME49 compositor and test real Wayland window rendering
          no_output_timeout: 30m
          command: sh tools/ci-mutter49.sh
      - run:
          name: Build Shell49 and verify native rendering and capability boundaries
          no_output_timeout: 30m
          command: sh tools/ci-shell49.sh
      - run:
          name: Build GNOME49 session and verify real CK, settings, apps and logout
          no_output_timeout: 30m
          command: sh tools/ci-gnome49.sh
      - store_artifacts:
          path: dist
          destination: freebsd

workflows:
  build:
    jobs:
      - freebsd-build-test-package
